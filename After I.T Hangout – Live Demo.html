<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After I.T Hangout – Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f7ec;--card:#fff;--ink:#16301f;--green:#1f6b3a;--lime:#8be36a;--gold:#f2b92a;--line:#c4e3cf;--muted:#4d6b58;--chip:#dff0e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f15;--card:#162a1c;--ink:#e8f6ec;--green:#2f8f55;--line:#294a34;--muted:#9bbca8;--chip:#1f3a29}}
:root[data-theme="dark"]{--bg:#0f1f15;--card:#162a1c;--ink:#e8f6ec;--green:#2f8f55;--line:#294a34;--muted:#9bbca8;--chip:#1f3a29}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Nunito,system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:14px 16px 48px}
h1,h2,h3{font-family:"Lilita One",Impact,sans-serif;font-weight:400;margin:0}
.switch{display:flex;gap:8px;background:var(--chip);padding:6px;border-radius:12px;margin-bottom:14px}
.switch button{flex:1;background:transparent;color:var(--ink)}.switch button.on{background:var(--green);color:#fff}
.demo{font-size:.82rem;color:var(--muted);text-align:center;margin:0 0 12px}
.hero{text-align:center;padding:12px 0 4px}.hero small{font-weight:800;color:var(--green)}
.hero h1{font-size:clamp(2.4rem,9vw,4.4rem);line-height:1;color:var(--lime);-webkit-text-stroke:2px #0d2415;paint-order:stroke fill;text-shadow:3px 3px 0 #0d2415;margin:6px 0 12px}
.tag{display:inline-block;background:#fff;color:#16301f;padding:6px 16px;font-weight:800;transform:rotate(-2deg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--gold);color:#2b2100;padding:10px 14px;font-weight:800;border-radius:4px}.fact span{display:block;font-weight:600;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:10px;margin-bottom:18px}
h2{font-size:1.5rem;margin-bottom:10px;color:var(--green)}
label{display:block;font-weight:800;margin:12px 0 4px}
input{width:100%;padding:12px;border:2px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:800;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--green);color:#fff}
button.big{padding:13px 20px;margin-top:14px}button.wa{background:#25d366;color:#04230f}button.no{background:#c0392b}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pay{background:#fff8e1;color:#2b2100;border:2px dashed var(--gold);padding:12px 14px;border-radius:8px;font-weight:700}
.note{font-size:.85rem;color:var(--muted)}.err{color:#e0584a;font-weight:700;min-height:1.3em}
.ticketwrap{overflow-x:auto;padding:4px;margin-bottom:10px}
.ticket{width:760px;height:300px;display:flex;background:linear-gradient(135deg,#dff7e6,#b9ecc8);color:#16301f;border-radius:16px;overflow:hidden}
.tmain{flex:1;padding:20px 22px;display:flex;flex-direction:column}.club{font-weight:800;color:#1f6b3a}
.tmain h3{font-size:2.3rem;line-height:1;margin:2px 0 8px;color:#8be36a;-webkit-text-stroke:1.5px #0d2415;paint-order:stroke fill;text-shadow:2px 2px 0 #0d2415}
.guest{background:#fff;padding:6px 12px;font-weight:800;font-size:1.15rem;border-radius:4px;width:max-content;max-width:100%}
.tmeta{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.85rem;font-weight:800}.tmeta b{display:block;font-weight:600;color:#2f5b40;font-size:.72rem}
.tstub{width:200px;background:#1d4a2c;color:#fff;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-left:3px dashed #f2b92a;text-align:center}
.badge{background:#f2b92a;color:#2b2100;font-weight:800;padding:2px 10px;border-radius:3px;font-size:.85rem}
.tstub svg{background:#fff;padding:6px;border-radius:6px}.tstub code{font-size:.82rem;color:#f2b92a;font-weight:800}
.banner{font-weight:800;padding:12px;border-radius:8px;margin-bottom:12px;text-align:center;color:#fff}.b-ok{background:#1f6b3a}.b-no{background:#c0392b}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted)}.acts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{background:var(--chip);color:var(--ink)}.tabs button.on{background:var(--green);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{background:var(--chip);padding:10px;border-radius:8px;font-weight:800}
.stat span{display:block;font-size:1.5rem;font-family:"Lilita One",sans-serif;font-weight:400}
.chat{background:#e5ddd5;color:#111;padding:12px;border-radius:10px;margin:10px 0}.chat div{background:#d9fdd3;padding:8px 10px;border-radius:8px;font-size:.9rem;white-space:pre-line}
.door{display:flex;gap:8px}.door input{flex:1}
</style>
</head>
<body>
<main>
<div class="switch"><button data-v="guest">Guest view</button><button data-v="admin">Admin dashboard</button></div>
<p class="demo">Demo only: everything here is in memory and nothing is really sent. Refreshing resets it.</p>
<div id="app"></div>
</main>
<script>
var T=[
{id:'FSC27-K4M9PX',name:'Tunde Adebayo',phone:'2348031112222',status:'pending'},
{id:'FSC27-R7T2QA',name:'Amaka Obi',phone:'2348055556666',status:'pending'},
{id:'FSC27-B3N8ZD',name:'Seun Bello',phone:'2347012345678',status:'approved'}];
var S={view:'guest',mine:null,tab:'pending',wa:null,door:null,err:''};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function code(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='FSC27-';for(var i=0;i<6;i++)s+=a[Math.floor(Math.random()*32)];return s}
function find(id){return T.filter(function(t){return t.id===id})[0]}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function qr(id){var x=hash(id)||1,r=function(){x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296},s='';
for(var y=0;y<21;y++)for(var c=0;c<21;c++){var fin=(c<7&&y<7)||(c>13&&y<7)||(c<7&&y>13),on;
if(fin){var lx=c%14<7?c%14:c-14,ly=y%14<7?y%14:y-14;on=lx==0||lx==6||ly==0||ly==6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}else on=r()>.5;
if(on)s+='<rect x="'+c+'" y="'+y+'" width="1" height="1" fill="#0d2415"/>'}
return '<svg width="104" height="104" viewBox="0 0 21 21" shape-rendering="crispEdges">'+s+'</svg>'}
function ticket(t){return '<div class="ticketwrap"><div class="ticket"><div class="tmain"><div class="club">FSC Class’ 27 presents</div><h3>AFTER I.T HANGOUT</h3><div class="guest">'+esc(t.name)+'</div>'+
'<div class="tmeta"><div><b>Date</b>28th Nov 2026</div><div><b>Time</b>2PM</div><div><b>Venue</b>Lions’ Lounge, Under G, Ogbomoso</div><div><b>Music</b>MC Mayor · DJ Starry</div></div></div>'+
'<div class="tstub"><span class="badge">ADMIT ONE</span>'+qr(t.id)+'<code>'+t.id+'</code></div></div></div>'}

function guest(){
 var t=S.mine&&find(S.mine);
 if(!t)return '<section class="hero"><small>FSC Class’ 27 presents</small><h1>AFTER I.T<br>HANGOUT</h1><span class="tag">Good Vibes, Great People!</span></section>'+
 '<section class="facts"><div class="fact"><span>Date</span>28th Nov 2026</div><div class="fact"><span>Time</span>2PM</div><div class="fact"><span>Venue</span>Lions’ Lounge, Under G, Ogbomoso</div><div class="fact"><span>Fee</span>₦3,500</div></section>'+
 '<section class="panel"><h2>Get your ticket</h2><div class="pay">1. Send ₦3,500 to the PalmPay account on the flier.<br>2. Fill the form and tap “Get ticket”.</div>'+
 '<form id="f"><label for="n">Full name</label><input id="n" autocomplete="name"><label for="p">WhatsApp number</label><input id="p" inputmode="tel" placeholder="08012345678">'+
 '<div class="err" role="alert">'+S.err+'</div><button class="big">Get ticket</button></form></section>';
 if(t.status==='pending')return '<section class="panel"><h2>Payment being confirmed</h2><p>Hi '+esc(t.name)+', we have your request. This page updates by itself once you are approved.</p>'+
 '<p class="note">Demo tip: switch to “Admin dashboard” above, approve this request, then come back here.</p></section>';
 if(t.status==='rejected')return '<section class="panel"><h2>Request not approved</h2><p>We could not confirm your payment. Contact the organisers.</p></section>';
 return (t.status==='used'?'<div class="banner b-no">ALREADY USED. Do not admit.</div>':'')+ticket(t)+'<button>Download ticket</button> <button data-a="reset" style="background:var(--chip);color:var(--ink)">Start over</button>'}

function admin(){
 var c=function(s){return T.filter(function(t){return t.status===s}).length},ok=c('approved')+c('used');
 var list=T.filter(function(t){return S.tab==='all'||t.status===S.tab});
 var h='<section class="panel"><h2>Admin</h2><div class="stats"><div class="stat"><span>'+c('pending')+'</span>Pending</div><div class="stat"><span>'+ok+'</span>Approved</div><div class="stat"><span>'+c('used')+'</span>Checked in</div><div class="stat"><span>₦'+(ok*3500).toLocaleString()+'</span>Expected</div></div>'+
 '<div class="tabs">'+['pending','approved','used','rejected','all'].map(function(s){return '<button data-tab="'+s+'" class="'+(S.tab===s?'on':'')+'">'+s+'</button>'}).join('')+'</div>';
 if(S.wa){var w=find(S.wa);h+='<div class="chat"><div>Hi '+esc(w.name)+'! 🎉 Your ticket for After I.T Hangout (28th Nov, 2PM, Lions’ Lounge) is confirmed.\nOpen and download your ticket: yoursite.com/?t='+w.id+'</div></div><p class="note">In the real app this opens WhatsApp with this message ready for '+esc(w.phone)+'. You just press Send.</p>'}
 h+=list.map(function(t){return '<div class="row"><div><b>'+esc(t.name)+'</b><small>'+t.phone+' · '+t.id+'</small></div><div class="acts">'+
 (t.status==='pending'||t.status==='rejected'?'<button class="wa" data-a="ok" data-id="'+t.id+'">Approve &amp; send</button>':'')+
 (t.status==='pending'?'<button class="no" data-a="no" data-id="'+t.id+'">Reject</button>':'')+
 (t.status==='approved'?'<button class="wa" data-a="send" data-id="'+t.id+'">Send on WhatsApp</button><button data-a="use" data-id="'+t.id+'">Mark used</button>':'')+
 (t.status==='used'?'<span class="badge">Checked in</span>':'')+'</div></div>'}).join('')||'<p class="note">Nothing here yet.</p>';
 h+='</section><section class="panel"><h2>Door check</h2><p class="note">In the real app you scan the QR with your phone camera. Here, type a ticket ID.</p><div class="door"><input id="d" placeholder="e.g. FSC27-B3N8ZD" aria-label="Ticket ID"><button data-a="check">Check</button></div>';
 if(S.door){var d=find(S.door.id);h+=!d?'<div class="banner b-no" style="margin-top:12px">NOT FOUND</div>':d.status==='approved'?'<div class="banner b-ok" style="margin-top:12px">VALID: '+esc(d.name)+'</div><button data-a="use" data-id="'+d.id+'">Mark as used</button>':d.status==='used'?'<div class="banner b-no" style="margin-top:12px">ALREADY USED: '+esc(d.name)+'</div>':'<div class="banner b-no" style="margin-top:12px">NOT APPROVED</div>'}
 return h+'</section>'}

function render(){
 document.querySelectorAll('.switch button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view)});
 $('#app').innerHTML=S.view==='guest'?guest():admin()}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){S.view=b.dataset.v;S.wa=null;return render()}
 if(b.dataset.tab){S.tab=b.dataset.tab;S.wa=null;return render()}
 var a=b.dataset.a,t=find(b.dataset.id);
 if(a==='ok'){t.status='approved';S.wa=t.id}
 if(a==='send')S.wa=t.id;
 if(a==='no')t.status='rejected';
 if(a==='use'){t.status='used';if(S.door)S.door={id:S.door.id}}
 if(a==='reset')S.mine=null;
 if(a==='check')S.door={id:$('#d').value.trim().toUpperCase()};
 if(a)render()});
document.addEventListener('submit',function(e){
 e.preventDefault();
 var n=$('#n').value.trim(),p=$('#p').value.replace(/\D/g,'');
 if(n.length<2){S.err='Enter your full name.';return render()}
 if(p.length<10){S.err='Enter a valid WhatsApp number.';return render()}
 S.err='';var t={id:code(),name:n,phone:'234'+p.replace(/^0/,''),status:'pending'};T.unshift(t);S.mine=t.id;render()});
render();
</script>
</body>
</html>
